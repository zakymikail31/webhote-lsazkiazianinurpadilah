<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservasi - Grand Horizon Hotel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <div class="logo">Grand Horizon</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="galeri.html">Galeri</a></li>
                <li><a href="form.html">Formulir</a></li>
                <li><a href="tabel.html">Tabel Data</a></li>
            </ul>
            <div class="hamburger" onclick="toggleMenu()"></div>
        </nav>
    </header>

    <div class="container">
        <h2>Formulir Reservasi Kamar</h2>
        <form id="bookingForm">
            <div class="form-group">
                <label>Nama Lengkap:</label>
                <input type="text" id="nama" required placeholder="Masukkan nama anda">
            </div>

            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="email" required placeholder="email@contoh.com">
            </div>

            <div class="form-group">
                <label>Nomor HP:</label>
                <input type="tel" id="phone" required placeholder="0812xxxx">
            </div>

            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 1;">
                    <label>Tanggal Check-in:</label>
                    <input type="date" id="checkin" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Durasi (Malam):</label>
                    <input type="number" id="durasi" min="1" value="1" required>
                </div>
            </div>

            <div class="form-group">
                <label>Tipe Kamar:</label>
                <select id="tipeKamar">
                    <option value="Standard">Standard Room</option>
                    <option value="Deluxe">Deluxe Room</option>
                    <option value="Suite">Executive Suite</option>
                </select>
            </div>

            <div class="form-group">
                <label>Pilihan Sarapan:</label>
                <input type="radio" name="breakfast" value="Ya" checked> Ya
                <input type="radio" name="breakfast" value="Tidak"> Tidak
            </div>

            <div class="form-group">
                <label>Permintaan Khusus:</label>
                <textarea id="pesan" rows="4" placeholder="Tulis permintaan khusus..."></textarea>
            </div>

            <button type="submit" class="btn-submit">Kirim Reservasi</button>
        </form>
    </div>

    <script>
        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault(); 

            // Ambil data dari input
            const dataReservasi = {
                nama: document.getElementById('nama').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                checkin: document.getElementById('checkin').value, // Data Baru
                durasi: document.getElementById('durasi').value,   // Data Baru
                kamar: document.getElementById('tipeKamar').value,
                sarapan: document.querySelector('input[name="breakfast"]:checked').value,
                pesan: document.getElementById('pesan').value,
                status: 'Confirmed' // Status otomatis
            };

            let daftarReservasi = JSON.parse(localStorage.getItem('reservasiHotel')) || [];
            daftarReservasi.push(dataReservasi);
            localStorage.setItem('reservasiHotel', JSON.stringify(daftarReservasi));

            alert('Data Reservasi Berhasil Disimpan!');
            window.location.href = 'tabel.html'; 
        });
    </script>

</body>
</html>
