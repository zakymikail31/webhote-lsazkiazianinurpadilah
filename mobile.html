<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tampilan Mobile Grand Horizon Hotel</title>
    <link rel="stylesheet" href="styleframe.css">
  </head>
  <body>
    <div>
      <div class="phone-frame">
        <div class="notch"></div>
        <div class="ios-statusbar">
          <span class="ios-time" id="ios-time">00:00</span>

          <div class="ios-icons">
            <svg class="ios-signal" width="20" height="13" viewBox="0 0 20 13">
              <rect x="0" y="8" width="3" height="5" rx="1.5" />
              <rect x="5" y="6" width="3" height="7" rx="1.5" />
              <rect x="10" y="4" width="3" height="9" rx="1.5" />
              <rect x="15" y="2" width="3" height="11" rx="1.5" />
            </svg>

            <svg class="ios-battery" width="28" height="14" viewBox="0 0 30 14">
              <rect x="1" y="1" width="24" height="12" rx="3" stroke="#000" stroke-width="2"/>
              <rect x="27" y="4" width="3" height="6" rx="1" fill="#000"/>
              <rect class="battery-fill" x="3" y="3" width="18" height="8" rx="2" fill="#000"/>
            </svg>
          </div>
        </div>
        <iframe src="index.html"></iframe>
      </div>
    </div>
    <script src="mobile.js"></script>
  </body>
</html>
